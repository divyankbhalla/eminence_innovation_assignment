<h2 mat-dialog-title>

    {{ data.task ? 'Edit Task' : 'Create Task' }}

</h2>

<mat-dialog-content>

<form [formGroup]="form">

    <mat-form-field appearance="outline">

        <mat-label>Title</mat-label>

        <input
            matInput
            formControlName="title">

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Description</mat-label>

        <textarea
            matInput
            rows="4"
            formControlName="description">
        </textarea>

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Priority</mat-label>

        <mat-select formControlName="priority">

            <mat-option value="LOW">
                Low
            </mat-option>

            <mat-option value="MEDIUM">
                Medium
            </mat-option>

            <mat-option value="HIGH">
                High
            </mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Status</mat-label>

        <mat-select formControlName="status">

            <mat-option value="PENDING">
                Pending
            </mat-option>

            <mat-option value="IN_PROGRESS">
                In Progress
            </mat-option>

            <mat-option value="COMPLETED">
                Completed
            </mat-option>

        </mat-select>

    </mat-form-field>

    <mat-form-field
        appearance="outline"
        *ngIf="data.users?.length">

            <mat-label>

                Assigned To

            </mat-label>

            <mat-select formControlName="assignedTo">

                <mat-option
                    *ngFor="let user of data.users"
                    [value]="user._id">

                    {{ user.username }} ({{ user.role }})

                </mat-option>

            </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>Due Date</mat-label>

        <input
            matInput
            [matDatepicker]="picker"
            formControlName="dueDate">

        <mat-datepicker-toggle
            matSuffix
            [for]="picker">
        </mat-datepicker-toggle>

        <mat-datepicker #picker></mat-datepicker>

    </mat-form-field>

</form>

</mat-dialog-content>

<mat-dialog-actions align="end">

<button
    mat-button
    (click)="cancel()">

    Cancel

</button>

<button
    mat-raised-button
    color="primary"
    (click)="save()">

    Save

</button>

</mat-dialog-actions>
