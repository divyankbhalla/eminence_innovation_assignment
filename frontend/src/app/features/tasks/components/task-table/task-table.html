<table
  mat-table
  [dataSource]="dataSource"
  matSort>

  <!-- Title -->
  <ng-container matColumnDef="title">
    <th
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header>
      Title
    </th>

    <td mat-cell *matCellDef="let task">
      {{ task.title }}
    </td>
  </ng-container>

  <!-- Assigned To -->
  <ng-container matColumnDef="assignedTo">
    <th mat-header-cell *matHeaderCellDef>
      Assigned To
    </th>

    <td mat-cell *matCellDef="let task">
      {{ task.assignedTo.username }}
    </td>
  </ng-container>

  <!-- Priority -->
  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef>
      Priority
    </th>

    <td mat-cell *matCellDef="let task">
      <mat-chip>
        {{ task.priority }}
      </mat-chip>
    </td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>
      Status
    </th>

    <td mat-cell *matCellDef="let task">
      <mat-chip>
        {{ task.status }}
      </mat-chip>
    </td>
  </ng-container>

  <!-- Due Date -->
  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>
      Due Date
    </th>

    <td mat-cell *matCellDef="let task">
      {{ task.dueDate | date:'mediumDate' }}
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>
      Actions
    </th>

    <td mat-cell *matCellDef="let task">

      <button
        mat-icon-button
        color="primary"
        (click)="onEdit(task)">

        <mat-icon>
          edit
        </mat-icon>

      </button>

      <button
        mat-icon-button
        color="warn"
        (click)="onDelete(task)">

        <mat-icon>
          delete
        </mat-icon>

      </button>

    </td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;">
  </tr>

</table>

<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[5, 10, 20]">
</mat-paginator>
