<h2 mat-dialog-title>

    Change User Role

</h2>

<mat-dialog-content>

    <p>

        <strong>User:</strong>

        {{ data.user.username }}

    </p>

    <form [formGroup]="form">

        <mat-form-field appearance="outline" class="full-width">

            <mat-label>

                Role

            </mat-label>

            <mat-select formControlName="role">

                <mat-option
                    *ngFor="let role of roles"
                    [value]="role">

                    {{ role }}

                </mat-option>

            </mat-select>

        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="save()">

        Save

    </button>

</mat-dialog-actions>
